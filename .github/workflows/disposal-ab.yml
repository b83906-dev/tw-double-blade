name: Disposal A-B Analysis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas requests
      - name: Download latest walk-forward artifact
        uses: dawidd6/action-download-artifact@v11
        with:
          workflow: validate-10y-walkforward.yml
          workflow_conclusion: success
          name: validation-walkforward
          path: data
      - name: Analyze disposal effect
        run: python scripts/analyze_disposal_ab.py
      - uses: actions/upload-artifact@v4
        with:
          name: disposal-ab-analysis
          path: |
            data/disposal_ab_summary.json
            data/disposal_ab_events.csv
            data/disposal_history.csv
          retention-days: 30
